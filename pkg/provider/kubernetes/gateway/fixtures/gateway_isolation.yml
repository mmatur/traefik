---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-a
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 9080
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-b
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 9080
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-a
  namespace: default
spec:
  parentRefs:
    - name: gateway-a
  hostnames:
    - example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: whoami
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-b
  namespace: default
spec:
  parentRefs:
    - name: gateway-b
  hostnames:
    - example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: whoami
          port: 80

# The Services an external controller provisions to give each Gateway an
# address of its own. They sit next to the shared data plane, and are found back
# by the Gateway labels they carry.
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-gateway-a
  namespace: traefik
  labels:
    gateway.networking.k8s.io/gateway-name: gateway-a
    gateway.traefik.io/gateway-namespace: default
spec:
  type: LoadBalancer
status:
  loadBalancer:
    ingress:
      - ip: 10.0.0.1

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-gateway-b
  namespace: traefik
  labels:
    gateway.networking.k8s.io/gateway-name: gateway-b
    gateway.traefik.io/gateway-namespace: default
spec:
  type: LoadBalancer
status:
  loadBalancer:
    ingress:
      - ip: 10.0.0.2
